<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>传播 X 光 · 审核卡片提案</title><style>
*{box-sizing:border-box}body{margin:0;color:#1d1d1f;background:#f5f5f7;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{height:66px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,5vw);border-bottom:1px solid #dedee3}header strong{font-size:21px}header a{color:#0066cc;text-decoration:none}main{max-width:1240px;margin:auto;padding:40px 24px}h1{font-size:38px;letter-spacing:-.03em;margin:0}h2,h3,p{margin:0 0 12px}.muted,small{color:#61616a}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.choices button,.plain,.primary{font:inherit;cursor:pointer;border:0;border-radius:22px;padding:10px 18px;min-height:44px}.choices button,.plain{background:#e9e9ee;color:#252529}.choices [aria-pressed=true],.primary{background:#0066cc;color:white}button:hover{filter:brightness(.94)}:focus-visible{outline:3px solid #0071e3;outline-offset:3px}.panel{background:#fff;border:1px solid #dedee3;border-radius:14px;padding:28px}.badge{display:inline-block;background:#f5ece0;color:#754a19;padding:4px 10px;border-radius:6px;font-size:12px}.quote{font-size:26px;line-height:1.45;letter-spacing:-.02em;margin:16px 0}.rewrite{background:#eef4fa;border-radius:8px;padding:17px}.actions{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}.split{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:16px}.queue{padding:18px}.queue button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e3e3e8;background:transparent;padding:13px 8px;font:inherit;cursor:pointer}.queue button[aria-pressed=true]{background:#edf4fb;color:#0055a6}.queue small{display:block}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sourcebar{margin-top:18px;padding:17px 0;border-top:1px solid #dedee3}.sourcebar summary{cursor:pointer;color:#005aaa}.steps{max-width:850px;margin:auto}.step{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:18px 0;border-top:1px solid #dedee3}.step strong{color:#35536c}.status{color:#285a45}[hidden]{display:none!important}@media(max-width:860px){.split{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.step{grid-template-columns:1fr;gap:4px}main{padding:28px 16px}.panel{padding:20px}}

.evidence-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
#evidence-form{display:grid;gap:8px;margin-top:18px;max-width:500px}
#evidence-form label{font-weight:600;margin-top:7px}
#evidence-form input,#evidence-form textarea,#evidence-form select{font:inherit;width:100%;padding:9px;border:1px solid #d2d2d9;border-radius:8px;background:#fafafc;color:#1d1d1f}
#evidence-form button{justify-self:start;margin-top:10px}
.material,.check-row{padding:14px 0;border-bottom:1px solid #dedee3;overflow-wrap:anywhere}
.material a{color:#0066cc}.material small,.check-row small{display:block}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
#export-review{margin-top:20px}
@media(max-width:740px){.evidence-grid{grid-template-columns:1fr;gap:26px}.check-row{align-items:flex-start;flex-direction:column}}
</style></head><body><header><strong>齐鲁卖点</strong><span>传播 X 光</span><button class="plain" id="return-studio">返回创作室</button></header>
<main><h1>发布前审核</h1><p class="muted"><span id="case-title">正在读取审核任务</span> <button class="plain" id="new-review">新建诊断或打开完整审核工具</button></p>
<p id="server-status" role="status"></p><div id="case-workspace" hidden><nav class="choices" aria-label="审核工作区"><button data-view="a" aria-pressed="true">逐句审核</button><button data-view="b" aria-pressed="false">佐证材料</button><button data-view="c" aria-pressed="false">复核清单</button></nav>
<section id="a" class="split"><nav class="panel queue" aria-label="文案句子"><h2>待核对表述</h2><button data-row="0" aria-pressed="true">自然清甜<small>口感依据待补</small></button><button data-row="1" aria-pressed="false">下单当天发货<small>履约条件待核对</small></button><button data-row="2" aria-pressed="false">山东苹果，5斤一箱<small>与录入资料一致</small></button></nav><article class="panel"><span class="badge" data-field="tag"></span><h2 class="quote" data-field="claim"></h2><p data-field="reason"></p><div class="rewrite"><h3>建议写法</h3><p data-field="rewrite"></p></div><div class="actions"><button class="primary review">标记已复核</button><span class="status" role="status"></span></div></article><aside class="panel"><h2>当前依据</h2><p data-field="source"></p><h3>还需核对</h3><p class="muted" data-field="need"></p><div class="sourcebar"><h3>关联材料</h3><div id="claim-evidence"></div><button class="plain" id="add-evidence">为这句添加材料</button></div></aside></section>
<section id="b" class="panel" hidden>
<div class="evidence-grid"><div><h2>佐证材料</h2><p class="muted">上传与宣传表述有关的商品标签、检测报告或发货说明。</p>
<form id="evidence-form"><label for="evidence-file">选择材料</label><input id="evidence-file" type="file" accept=".pdf,.docx,.txt" required>
<label for="evidence-claim">关联到哪一句</label><select id="evidence-claim"></select>
<label for="evidence-note">依据在哪里（可选）</label><textarea id="evidence-note" rows="3" maxlength="300" placeholder="例如：报告第 2 页的检测项目和批次号"></textarea>
<button class="primary" type="submit">添加并关联材料</button></form><p id="upload-status" role="status" class="muted"></p></div>
<div><h3>已关联材料</h3><div id="evidence-list"></div><small>材料会提交给审核服务器。请使用获授权的资料。</small></div></div></section>
<section id="c" class="panel" hidden><h2>复核清单</h2><p class="muted">发布前逐条确认。关联材料与完成复核分别记录。</p><div id="review-list"></div><button class="primary" id="export-review">下载复核清单</button></section>
<p class="muted" style="margin-top:22px">关联材料后，请核对它是否支持当前表述。</p></div></main>
<script src="review.js"></script></body></html>
