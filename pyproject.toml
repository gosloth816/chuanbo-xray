[project]
name = "chuanbo-xray"
version = "2.0.0"
description = "农业科技产品宣传材料诊断与证据核验工具"
requires-python = ">=3.10"
dependencies = [
  "streamlit==1.51.0",
  "pypdf==6.4.0",
  "python-docx==1.2.0",
  "pandas==2.3.3",
  "pillow==12.1.0",
  "requests==2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
