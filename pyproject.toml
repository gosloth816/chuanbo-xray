[project]
name = "chuanbo-xray"
version = "2.0.0"
description = "农业科技产品宣传材料诊断与证据核验工具"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.60,<2",
  "pypdf>=7,<8",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<3",
  "pillow>=13,<14",
  "requests>=2.31,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

