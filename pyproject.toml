[project]
name = "chuanbo-xray"
version = "2.0.0"
description = "农业科技产品宣传材料诊断与证据核验工具"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.51,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "requests>=2.31,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

